<div class="admin-shell">
  <aside class="rail" aria-label="Admin navigation">
    <div class="rail-brand">
      <span class="mark" aria-hidden="true">ops</span>
      <div>
        <div class="brand-name">CoA Admin</div>
        <div class="brand-sub">Knowledge ops</div>
      </div>
    </div>

    <p class="rail-label">Console</p>
    <nav>
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="rail-link"
        >
          <i [class]="'bi ' + item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="rail-foot">
      <code>UI → admin_api → knowledge → DAG</code>
    </div>
  </aside>

  <div class="main-col">
    <header class="statusbar">
      <span class="env">local</span>
      <span class="sep" aria-hidden="true">·</span>
      <span class="path">coa_admin_api :8094</span>
      <span class="spacer"></span>
      <span class="live"><i class="bi bi-circle-fill" aria-hidden="true"></i> console</span>
    </header>

    <main class="canvas">
      <router-outlet />
    </main>
  </div>
</div>
