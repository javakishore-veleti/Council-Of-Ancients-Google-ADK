<div class="shell animate__animated animate__fadeIn">
  <header class="topbar">
    <div class="brand">
      <fa-icon [icon]="brandIcon" class="brand-icon" routerLink="/app"></fa-icon>
      <div class="brand-copy">
        <button type="button" class="brand-mark" routerLink="/app">Council of Ancients</button>
        <button
          type="button"
          class="professor-hat"
          (click)="openCouncilMeaning($event)"
          pTooltip="What is a council?"
          tooltipPosition="bottom"
          aria-label="What is a council?"
        >
          <fa-icon [icon]="professorHat"></fa-icon>
        </button>
      </div>
    </div>

    <p-dialog
      header="What is a council?"
      [(visible)]="councilMeaningVisible"
      [modal]="true"
      [draggable]="false"
      [style]="{ width: 'min(480px, 92vw)' }"
      styleClass="council-meaning-dialog"
    >
      <p class="council-meaning-text">{{ councilMeaning }}</p>
    </p-dialog>

    <nav class="pack-nav" aria-label="Domain packs">
      @for (pack of packs; track pack.id) {
        <button
          type="button"
          class="pack-tab"
          [class.active]="prefs.activePackId() === pack.id"
          (click)="selectPack(pack.id)"
          [pTooltip]="pack.tagline"
          tooltipPosition="bottom"
        >
          <span class="pack-label-full">{{ pack.label }}</span>
          <span class="pack-label-short">{{ pack.shortLabel }}</span>
          @if (!pack.kbReady) {
            <p-tag severity="warn" value="KB soon" styleClass="soon-tag" />
          }
        </button>
      }
    </nav>

    <div class="top-actions">
      <button
        pButton
        type="button"
        class="p-button-text p-button-rounded"
        icon="pi pi-cog"
        routerLink="/app/settings/global"
        pTooltip="Global settings"
      ></button>
      <div class="account">
        <p-avatar
          [label]="(auth.user()?.displayName || 'U').slice(0, 1).toUpperCase()"
          shape="circle"
          styleClass="acct-avatar"
        />
        <div class="acct-meta d-none d-lg-block">
          <div class="acct-name">{{ auth.user()?.displayName }}</div>
          <button type="button" class="signout" (click)="signOut()">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="body-grid">
    <aside class="left-nav coa-glass">
      <div class="pack-title">
        <h2>{{ prefs.activePack().label }}</h2>
        <p>{{ prefs.activePack().tagline }}</p>
      </div>
      <ul>
        @for (item of prefs.activePack().nav; track item.id) {
          <li>
            <button
              type="button"
              class="nav-item"
              [class.active]="prefs.activeNavId() === item.id"
              [class.kb-locked]="item.disabledUntilKb && !prefs.activePack().kbReady"
              [disabled]="item.disabledUntilKb && !prefs.activePack().kbReady"
              (click)="goNav(item.route, item.id)"
            >
              <i [class]="item.icon"></i>
              <span>{{ item.label }}</span>
              @if (item.disabledUntilKb && !prefs.activePack().kbReady) {
                <span class="lock">soon</span>
              }
            </button>
          </li>
        }
      </ul>
    </aside>

    <main class="canvas coa-glass">
      <router-outlet />
    </main>
  </div>
</div>
