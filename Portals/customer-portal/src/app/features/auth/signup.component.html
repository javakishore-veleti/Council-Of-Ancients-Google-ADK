<div class="auth-page">
  <div class="auth-hero animate__animated animate__fadeInLeft">
    <div class="hero-inner">
      <fa-icon [icon]="brandIcon" class="hero-icon"></fa-icon>
      <h1 class="brand-mark">Join the chamber</h1>
      <p>
        Create your workspace. Global preferences travel with you; every chat can override them.
      </p>
    </div>
  </div>

  <div class="auth-card coa-glass animate__animated animate__fadeInRight">
    <h2>Sign up</h2>
    <p class="lede">A few details to open your portal.</p>

    @if (error()) {
      <p-message severity="error" [text]="error()" styleClass="w-100 mb-3" />
    }

    <form class="auth-form" (ngSubmit)="submit()">
      <label>
        Display name
        <input pInputText [(ngModel)]="displayName" name="displayName" class="w-100" required />
      </label>
      <label>
        Email
        <input pInputText type="email" [(ngModel)]="email" name="email" class="w-100" required />
      </label>
      <label>
        Password
        <p-password
          [(ngModel)]="password"
          name="password"
          [toggleMask]="true"
          styleClass="w-100"
          inputStyleClass="w-100"
          required
        />
      </label>
      <button
        pButton
        type="submit"
        label="Create account"
        icon="pi pi-user-plus"
        class="w-100 cta"
      ></button>
    </form>

    <p class="switch">
      Already have an account?
      <a routerLink="/signin">Sign in</a>
    </p>
  </div>
</div>
