<div class="sessions">
  <div class="head">
    <div>
      <h2 class="display-font">Sessions</h2>
      <p class="sub">Showing: {{ filterLabel() }}</p>
    </div>
    <button
      pButton
      type="button"
      label="New chat"
      icon="pi pi-plus"
      (click)="create()"
    ></button>
  </div>

  <div class="filters">
    <button
      type="button"
      class="coa-chip"
      [class.active]="filterSectionId() === prefs.lastContentSectionId() && filterSectionId() !== ''"
      (click)="setFilter(prefs.lastContentSectionId())"
    >
      {{ prefs.sectionLabel(prefs.lastContentSectionId()) }}
    </button>
    @for (sec of prefs.contentSections(); track sec.id) {
      @if (sec.id !== prefs.lastContentSectionId()) {
        <button
          type="button"
          class="coa-chip"
          [class.active]="filterSectionId() === sec.id"
          (click)="setFilter(sec.id)"
        >
          {{ sec.label }}
        </button>
      }
    }
    <button
      type="button"
      class="coa-chip"
      [class.active]="filterSectionId() === ''"
      (click)="setFilter('')"
    >
      All sections
    </button>
  </div>

  <p-table [value]="filteredProjects()" styleClass="p-datatable-sm session-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Section</th>
        <th>Title</th>
        <th>Updated</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>{{ sectionName(row.sectionId) }}</td>
        <td>{{ row.title }}</td>
        <td>{{ row.updatedAt | date: 'medium' }}</td>
        <td class="text-end">
          <button
            pButton
            type="button"
            label="Open"
            class="p-button-text"
            (click)="open(row.id)"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">No chats in {{ filterLabel() }} yet.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
