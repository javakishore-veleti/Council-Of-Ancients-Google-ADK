name: GCP-003-Setup-ModelArmor

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Model Armor region (both templates must use this)"
        required: false
        default: "us-central1"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  setup-model-armor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Create Model Armor templates
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          MODEL_ARMOR_REGION: ${{ inputs.region }}
        run: |
          chmod +x CICD/GCP/scripts/*.sh
          ./CICD/GCP/scripts/setup-model-armor.sh
