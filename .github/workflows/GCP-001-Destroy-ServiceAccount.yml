name: GCP-001-Destroy-ServiceAccount

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: delete-service-account'
        required: true
        type: string
      region:
        description: "Regional default"
        required: false
        default: "us-central1"
        type: string
      service_account_name:
        description: "Runtime service account id (not email)"
        required: false
        default: "council-of-ancients-sa"
        type: string

permissions:
  contents: read

jobs:
  destroy-service-account:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Delete runtime service account + IAM
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          MODEL_ARMOR_REGION: ${{ inputs.region }}
          COUNCIL_SERVICE_ACCOUNT: ${{ inputs.service_account_name }}
          CONFIRM_DESTROY: ${{ inputs.confirm }}
        run: |
          chmod +x CICD/GCP/scripts/*.sh
          ./CICD/GCP/scripts/destroy-service-account.sh
