name: GCP-001-Setup-APIs

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Model Armor / regional default (unused for API enable, kept for consistency)"
        required: false
        default: "us-central1"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  setup-apis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Enable APIs
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          MODEL_ARMOR_REGION: ${{ inputs.region }}
        run: |
          chmod +x CICD/GCP/scripts/*.sh
          ./CICD/GCP/scripts/setup-apis.sh
