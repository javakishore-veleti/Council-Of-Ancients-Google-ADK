name: GCP-001-Destroy-APIs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: disable-apis'
        required: true
        type: string
      region:
        description: "Regional default"
        required: false
        default: "us-central1"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  destroy-apis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Disable APIs
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          MODEL_ARMOR_REGION: ${{ inputs.region }}
          CONFIRM_DESTROY: ${{ inputs.confirm }}
        run: |
          chmod +x CICD/GCP/scripts/*.sh
          ./CICD/GCP/scripts/destroy-apis.sh
