name: GCP-001-Setup-ServiceAccount

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Regional default"
        required: false
        default: "us-central1"
        type: string
      service_account_name:
        description: "Runtime service account id (not email)"
        required: false
        default: "council-of-ancients-sa"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  setup-service-account:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Create runtime service account + IAM
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          MODEL_ARMOR_REGION: ${{ inputs.region }}
          COUNCIL_SERVICE_ACCOUNT: ${{ inputs.service_account_name }}
        run: |
          chmod +x CICD/GCP/scripts/*.sh
          ./CICD/GCP/scripts/setup-service-account.sh
