# Liquibase (outside Python packages). Used by CICD/Local/knowledge-db-apply.sh.
changeLogFile=changelog/db.changelog-master.xml
searchPath=.
driver=org.postgresql.Driver
# JDBC URL overridden at runtime for Docker network (council-postgres) or host.
url=jdbc:postgresql://localhost:5432/council
username=postgres
password=postgres
defaultSchemaName=public
liquibaseSchemaName=public
