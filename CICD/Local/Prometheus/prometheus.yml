global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: council-of-ancients
    env: local

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          component: otel-collector

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          component: otel-collector-internal

  - job_name: council-app
    metrics_path: /metrics
    static_configs:
      # setup_observability() serves Prometheus on PROMETHEUS_METRICS_PORT (default 9108).
      - targets: ["host.docker.internal:9108"]
        labels:
          component: council-api
    # Host app may be down; scrape failures are OK until the API starts metrics.
    scrape_interval: 30s
