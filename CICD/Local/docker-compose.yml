# Local infrastructure for Council of Ancients.
# Default app DB is SQLite (no container required).
#
# Usage:
#   ./docker-all-up.sh                 # Redis + Jaeger + OTEL Collector
#   ./docker-all-up.sh --postgres      # + Postgres
#   ./docker-all-up.sh --observability # + Prometheus, Grafana, Phoenix, Loki, coa_observability_api
#   ./docker-all-down.sh
#   ./docker-all-status.sh

name: council-local

services:
  redis:
    image: redis:7-alpine
    container_name: council-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./Redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - council-net
    restart: unless-stopped

  # Traces UI. OTLP from apps goes to otel-collector (4317/4318), which forwards here.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: council-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    volumes:
      - ./Jaeger/jaeger-ui.json:/etc/jaeger/jaeger-ui.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - council-net
    restart: unless-stopped

  # OTLP front door for AIOps / LLMOps (traces + metrics).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: council-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./Otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROM_PORT:-8889}:8889"
    depends_on:
      - jaeger
    networks:
      - council-net
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: council-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-council}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-council}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - council-net
    restart: unless-stopped

  # --- AIOps / LLMOps / DataOps (profile: observability) ---

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    container_name: council-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./Prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector
    networks:
      - council-net
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    container_name: council-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./Grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - council-net
    restart: unless-stopped

  # LLMOps UI: traces, generations, token/latency inspection (OpenTelemetry / OpenInference).
  phoenix:
    profiles: ["observability"]
    image: arizephoenix/phoenix:version-8.0.0
    container_name: council-phoenix
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
      - "${PHOENIX_OTLP_PORT:-4319}:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data
    networks:
      - council-net
    restart: unless-stopped

  # DataOps-style log aggregation for deliberation / API logs.
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.2.1
    container_name: council-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./Loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - council-net
    restart: unless-stopped

  # Async ingest API: ingest_obs_feed → facade → OBS_TASK_* → sub-facades → plugins.
  coa-observability-api:
    profiles: ["observability"]
    build:
      context: ../..
      dockerfile: Middleware/API-Services/coa_observability_api/Dockerfile
    image: council-coa-observability-api:local
    container_name: council-coa-observability-api
    ports:
      - "${COA_OBS_API_PORT:-8088}:8088"
      - "${PROMETHEUS_METRICS_PORT:-9108}:9108"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OTEL_SERVICE_NAME: coa_observability_api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PHOENIX_OTLP_ENDPOINT: http://phoenix:4317
      LOKI_URL: http://loki:3100
      PROMETHEUS_METRICS_PORT: "9108"
      # Task gates (default off). Override via CICD/Local/.env or compose env.
      OBS_TASK_EMIT_METRICS: ${OBS_TASK_EMIT_METRICS:-false}
      OBS_TASK_EMIT_TRACES: ${OBS_TASK_EMIT_TRACES:-false}
      OBS_TASK_EMIT_LOGS: ${OBS_TASK_EMIT_LOGS:-false}
      OBS_TASK_EMIT_LLMOPS: ${OBS_TASK_EMIT_LLMOPS:-false}
    depends_on:
      - otel-collector
      - loki
      - phoenix
    networks:
      - council-net
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  phoenix_data:
  loki_data:

networks:
  council-net:
    name: council-local-net
