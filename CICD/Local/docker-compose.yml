# Local infrastructure for Council of Ancients.
# Default app DB is SQLite (no container required).
# Start Postgres only when overriding DB_BACKEND=postgres (compose profile: postgres).
#
# Usage:
#   ./docker-all-up.sh              # Redis + Jaeger
#   ./docker-all-up.sh --postgres   # Redis + Jaeger + Postgres
#   ./docker-all-down.sh
#   ./docker-all-status.sh

name: council-local

services:
  redis:
    image: redis:7-alpine
    container_name: council-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./Redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - council-net
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: council-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./Jaeger/jaeger-ui.json:/etc/jaeger/jaeger-ui.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - council-net
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: council-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-council}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-council}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - council-net
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  council-net:
    name: council-local-net
